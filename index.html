<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout Log</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏋️</text></svg>">
<style>
  :root {
    --ground: #171310;
    --panel: #211b16;
    --line: #3a2f26;
    --text: #f2e9db;
    --text-dim: #a99a87;
    --glow: #e8a33d;
    --glow-bright: #ffcf7a;
    --ok: #6fcf7c;
    --err: #e0665a;
    --accent-blue: #3a6ea5;
    --accent-green: #4caf50;
  }
  * { box-sizing: border-box; }
  /* Author display rules (flex/grid on labels, buttons, etc.) otherwise beat
     the UA stylesheet's [hidden]{display:none} regardless of specificity,
     since origin is checked before specificity in the cascade. */
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--ground); color: var(--text); }
  body {
    min-height: 100dvh;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    padding: 20px 16px 0;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 6px 0 20px;
  }
  .header svg { flex-shrink: 0; }
  .header svg.blue { color: var(--accent-blue); }
  .header svg.orange { color: var(--glow-bright); }
  h1 {
    font-size: 24px;
    letter-spacing: 0.03em;
    margin: 0;
    color: var(--glow-bright);
    text-transform: uppercase;
    white-space: nowrap;
  }
  .banner {
    margin: 32px -16px 0;
    padding: 16px 16px 28px;
    background: linear-gradient(90deg, var(--accent-blue), var(--glow));
    color: #fff;
    text-align: center;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 480px;
    margin: 0 auto;
  }
  label {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13px;
    color: var(--text-dim);
  }
  input, select, textarea {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    padding: 14px;
    font-size: 17px;
    font-family: inherit;
    width: 100%;
    min-width: 0;
  }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--glow);
    border-color: var(--glow);
  }
  .row { display: flex; gap: 10px; }
  .row > label, .row > div { flex: 1; }
  .prescribed {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 13px;
  }
  .prescribed .item { display: flex; flex-direction: column; gap: 4px; }
  .prescribed .label { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .prescribed .value { font-size: 16px; color: var(--glow-bright); font-weight: 600; }
  .plates-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 4px 14px 14px;
  }
  .finished-label {
    color: var(--err);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.02em;
  }
  .plate {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-weight: 700;
    font-family: ui-sans-serif, system-ui, sans-serif;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.25);
    flex-shrink: 0;
  }
  .plate-45   { width: 46px; height: 46px; background: #3a6ea5; color: #fff; font-size: 13px; }
  .plate-35   { width: 42px; height: 42px; background: #4caf50; color: #fff; font-size: 12px; }
  .plate-25   { width: 38px; height: 38px; background: #d4b83a; color: #211b16; font-size: 12px; }
  .plate-10   { width: 32px; height: 32px; background: #f2e9db; color: #211b16; font-size: 11px; }
  .plate-5    { width: 24px; height: 24px; background: #e0665a; color: #fff; font-size: 10px; }
  .plate-2-5  { width: 18px; height: 18px; background: #e88ac6; color: #211b16; font-size: 8px; }
  .bar-only {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
    padding: 12px 0;
  }
  .pin-icon { flex-shrink: 0; }
  button {
    margin-top: 6px;
    padding: 16px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--glow-bright), var(--glow));
    color: #241705;
    font-weight: 700;
    font-size: 17px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; }
  #status {
    max-width: 480px;
    margin: 12px auto 0;
    font-size: 14px;
    min-height: 20px;
  }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
  .rest-timer {
    max-width: 480px;
    margin: 16px auto 0;
    background: var(--panel);
    border: 1px solid var(--accent-blue);
    border-radius: 14px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .rest-timer .rest-label {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .rest-timer .rest-clock {
    font-size: 40px;
    font-weight: 800;
    color: var(--glow-bright);
    font-variant-numeric: tabular-nums;
  }
  .rest-timer.done .rest-clock { color: var(--ok); }
  .rest-timer button {
    margin: 0;
    padding: 10px 22px;
    font-size: 14px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-dim);
    border-radius: 999px;
  }
  .today {
    max-width: 480px;
    margin: 28px auto 0;
  }
  .today h2 {
    font-size: 15px;
    color: var(--text-dim);
    margin: 0 0 10px;
  }
  .today table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .today th, .today td {
    text-align: left;
    padding: 8px 6px;
    border-bottom: 1px solid var(--line);
  }
  .today th { color: var(--text-dim); font-weight: 500; }
  .tabs {
    display: flex;
    gap: 8px;
    max-width: 480px;
    margin: 0 auto 22px;
  }
  .tab-btn {
    flex: 1;
    margin: 0;
    padding: 10px 4px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text-dim);
    cursor: pointer;
  }
  .tab-btn.today.active { border-color: var(--glow); color: var(--glow-bright); background: rgba(232, 163, 61, 0.14); }
  .tab-btn.week.active { border-color: var(--accent-blue); color: #9dc3e8; background: rgba(58, 110, 165, 0.18); }
  .tab-btn.month.active { border-color: var(--accent-green); color: #9adf9e; background: rgba(76, 175, 80, 0.14); }
  .tab-btn.progress.active { border-color: #9085e9; color: #c9c3f7; background: rgba(144, 133, 233, 0.18); }
  .range-view { max-width: 480px; margin: 0 auto; }
  .range-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 480px;
    margin: 0 auto 18px;
    gap: 10px;
  }
  .range-nav button {
    margin: 0;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 700;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text-dim);
    border-radius: 999px;
    cursor: pointer;
  }
  .range-nav span {
    font-size: 14px;
    font-weight: 700;
    color: var(--glow-bright);
    text-align: center;
    flex: 1;
  }
  .today-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
  }
  .today-header h2 { margin: 0; }
  .today-header-actions { display: flex; gap: 8px; }
  .report-actions { margin-top: 10px; }
  .pdf-btn {
    margin: 0;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 700;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text-dim);
    border-radius: 999px;
    cursor: pointer;
  }
  .date-group { margin-bottom: 22px; }
  .date-group h3 { font-size: 14px; color: var(--glow-bright); margin: 0 0 8px; }
  .date-group table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .date-group th, .date-group td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  .date-group th { color: var(--text-dim); font-weight: 500; }
  .empty-note { color: var(--text-dim); font-size: 14px; text-align: center; padding: 30px 0; }
  .week-card {
    max-width: 480px;
    margin: 0 auto 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  .week-card summary {
    padding: 16px;
    cursor: pointer;
    font-weight: 700;
    font-size: 14px;
    color: #9dc3e8;
    list-style: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .week-card summary::-webkit-details-marker { display: none; }
  .week-card summary::after {
    content: "▾";
    color: var(--text-dim);
    transition: transform 0.15s ease;
    margin-left: 10px;
  }
  .week-card[open] summary::after { transform: rotate(180deg); }
  .week-card[open] summary { border-bottom: 1px solid var(--line); }
  .week-card.current-week { border-color: var(--glow); }
  .week-card.current-week summary { color: var(--glow-bright); }
  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    max-width: 480px;
    margin: 0 auto 20px;
  }
  .cal-weekday {
    text-align: center;
    font-size: 10px;
    color: var(--text-dim);
    padding: 0 0 6px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .cal-day {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    padding: 0;
  }
  .cal-day.other-month {
    background: transparent;
    border-color: transparent;
    color: var(--line);
    cursor: default;
  }
  .cal-day.today { border-color: var(--glow); color: var(--glow-bright); font-weight: 700; }
  .cal-day.selected { background: rgba(76, 175, 80, 0.18); border-color: var(--accent-green); }
  .cal-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent-green); }
  .cal-day.today .cal-dot { background: var(--glow-bright); }
  .week-card-body { padding: 14px 16px 4px; }
  .week-card-body .date-group:last-child { margin-bottom: 10px; }
  .progression-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 14px 8px;
    margin-bottom: 22px;
  }
  .progression-card h3 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin: 0 0 6px;
  }
  .progression-card svg { display: block; width: 100%; height: auto; }
  #custom-fields { display: flex; flex-direction: column; gap: 14px; }
</style>
</head>
<body>
<div class="header">
  <svg class="orange" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <path d="M2 12h2M6 8v8M6 8a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1zM9 12h6"/>
  </svg>
  <h1>Workout Log</h1>
  <svg class="blue" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <path d="M22 12h-2M18 8v8M18 8a1 1 0 0 0-1-1h-1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1zM15 12H9"/>
  </svg>
</div>

<div class="tabs">
  <button type="button" class="tab-btn today active" data-tab="today">Today</button>
  <button type="button" class="tab-btn week" data-tab="week">Week</button>
  <button type="button" class="tab-btn month" data-tab="month">Month</button>
  <button type="button" class="tab-btn progress" data-tab="progress">Progress</button>
</div>

<div id="tab-today" class="tab-panel">
<form id="log-form">
  <label><span>Date <span id="date-weekday" style="color: var(--glow-bright); font-weight: 600;"></span></span>
    <input type="date" id="date" required>
  </label>

  <label>Exercise
    <select id="exercise" required>
      <option value="Incline Bench Press">Incline Bench Press</option>
      <option value="Squat (Body Masters PS300)">Squat (Body Masters PS300)</option>
      <option value="Body Masters 310 Chest Press - Vertical">Body Masters 310 Chest Press - Vertical</option>
      <option value="Precor - Vertical Row 309">Precor - Vertical Row 309</option>
      <option value="BODY MASTERS CM 240 - Lat Pull-down">BODY MASTERS CM 240 - Lat Pull-down</option>
      <option value="Nautilus Nitro - Vertical Chest">Nautilus Nitro - Vertical Chest</option>
      <option value="__custom__">+ Custom (build as you go)</option>
    </select>
  </label>

  <div id="standard-fields">
    <label>Week
      <select id="week" required></select>
    </label>

    <label>Phase
      <select id="phase" required></select>
    </label>

    <div class="prescribed">
      <div class="item"><span class="label">Target Weight</span><span class="value" id="p-weight">—</span></div>
      <div class="item"><span class="label">Target Reps</span><span class="value" id="p-reps">—</span></div>
      <div class="item"><span class="label">Rest</span><span class="value" id="p-rest">—</span></div>
    </div>
    <div class="plates-row" id="p-plates"></div>
  </div>

  <div id="custom-fields" hidden>
    <label id="custom-exercise-label">Exercise Name
      <input type="text" id="custom-exercise" placeholder="e.g. Flat Bench Press">
    </label>
    <label>Week / Block <span style="color: var(--text-dim); font-weight: 400;">(optional)</span>
      <input type="text" id="custom-week" placeholder="e.g. Week 1 - Foundation">
    </label>
    <div class="row">
      <label>Phase / Set Label
        <input type="text" id="custom-phase" placeholder="e.g. Working Set 1">
      </label>
      <label>Set #
        <input type="number" id="custom-set-number" inputmode="numeric" min="1" step="1" value="1">
      </label>
    </div>
    <div class="row">
      <label>Target Weight <span style="color: var(--text-dim); font-weight: 400;">(optional)</span>
        <input type="number" id="custom-target-weight" inputmode="decimal" step="0.5">
      </label>
      <label>Target Reps <span style="color: var(--text-dim); font-weight: 400;">(optional)</span>
        <input type="text" id="custom-target-reps" placeholder="e.g. 2 reps">
      </label>
    </div>
    <label>Rest <span style="color: var(--text-dim); font-weight: 400;">(optional, e.g. "90 sec" or "3 min")</span>
      <input type="text" id="custom-rest" placeholder="e.g. 2 min">
    </label>
  </div>

  <div class="row">
    <label>Actual Weight (lbs)
      <input type="number" id="actualWeight" inputmode="decimal" step="0.5" required>
    </label>
    <label>Actual Reps
      <input type="number" id="reps" inputmode="numeric" min="0" step="1" required>
    </label>
  </div>

  <label>Notes
    <textarea id="notes" rows="2" placeholder="optional"></textarea>
  </label>

  <button type="submit" id="submit-btn">Log set</button>
  <div id="status"></div>
</form>

<div class="rest-timer" id="rest-timer" hidden>
  <span class="rest-label">Rest</span>
  <span class="rest-clock" id="rest-clock">0:00</span>
  <button type="button" id="skip-rest">Skip rest</button>
</div>

<div class="today">
  <div class="today-header">
    <h2 id="today-heading">Logged</h2>
    <div class="today-header-actions">
      <button type="button" id="download-pdf-btn" class="pdf-btn">Download PDF</button>
      <button type="button" id="email-pdf-btn" class="pdf-btn">Email to Me</button>
    </div>
  </div>
  <table>
    <thead>
      <tr><th>Exercise</th><th>Phase</th><th>Weight</th><th>Reps</th></tr>
    </thead>
    <tbody id="today-body"></tbody>
  </table>
</div>
</div>

<div id="tab-week" class="tab-panel" hidden>
  <div class="range-nav">
    <button type="button" id="week-prev">‹ Prev</button>
    <span id="week-label"></span>
    <button type="button" id="week-next">Next ›</button>
  </div>
  <div class="range-view" id="week-body"></div>
</div>

<div id="tab-month" class="tab-panel" hidden>
  <div class="range-nav">
    <button type="button" id="month-prev">‹ Prev</button>
    <span id="month-label"></span>
    <button type="button" id="month-next">Next ›</button>
  </div>
  <div class="range-view" id="month-calendar"></div>
  <div class="range-view" id="month-day-detail"></div>
</div>

<div id="tab-progress" class="tab-panel" hidden>
  <div class="range-nav">
    <button type="button" id="progress-prev">‹ Prev</button>
    <span id="progress-label"></span>
    <button type="button" id="progress-next">Next ›</button>
  </div>
  <div class="range-view" id="progress-body"></div>
</div>

<div class="banner">⚡ Track today. Stronger tomorrow. ⚡</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  function parseRestSeconds(rest) {
    if (!rest) return null;
    const range = rest.match(/(\d+)\s*-\s*(\d+)\s*min/);
    if (range) return parseInt(range[2], 10) * 60;
    const min = rest.match(/(\d+)\s*min/);
    if (min) return parseInt(min[1], 10) * 60;
    const sec = rest.match(/(\d+)\s*sec/);
    if (sec) return parseInt(sec[1], 10);
    return null;
  }

  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      osc.start();
      osc.stop(ctx.currentTime + 0.5);
    } catch (e) {
      // audio not available — silent no-op
    }
  }

  let restInterval = null;

  function formatClock(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${m}:${String(sec).padStart(2, "0")}`;
  }

  function stopRestTimer() {

  function startRestTimer(seconds) {
    stopRestTimer();
    let remaining = seconds;
    restTimerEl.hidden = false;
    restClockEl.textContent = formatClock(remaining);
    restInterval = setInterval(() => {
      remaining -= 1;
      if (remaining <= 0) {
        clearInterval(restInterval);
        restInterval = null;
        restClockEl.textContent = "Go!";
        restTimerEl.classList.add("done");
        beep();
        return;
      }
      restClockEl.textContent = formatClock(remaining);
    }, 1000);
  }

  // Week-completion locking: a week is "done" once its last phase has been
  // logged for this exercise. Done weeks grey out in the dropdown; once all
  // weeks in the plan are done (Max Attempt included), the cycle resets and
  // every week unlocks again for the next block. Derived from actual Notion
  // history (not a separate flag) so it's always true to what's really logged,
  // and tracked independently per exercise.
  function computeCompletedWeeks(rows, plan) {
    const totalWeeks = Object.keys(plan).length;
    let completed = new Set();
    for (const row of rows) {
      const steps = plan[row.week];
      if (!steps) continue;
      const lastPhase = steps[steps.length - 1].phase;
      if (row.phase === lastPhase) {
        completed.add(row.week);
        if (completed.size === totalWeeks) completed = new Set();
      }
    }
    return completed;
  }

  async function refreshWeekLocks() {
    if (isFreeEntryMode()) return;
    const plan = currentPlan();
    const exercise = exerciseSelect.value;
    let rows;
    try {
      const res = await fetch(`${WORKER_URL}/history?exercise=${encodeURIComponent(exercise)}`);
      if (!res.ok) return;
      rows = (await res.json()).rows || [];
    } catch (e) {
      return; // lock state is a convenience, not critical path
    }
    if (exerciseSelect.value !== exercise) return; // exercise changed mid-fetch

    const completed = computeCompletedWeeks(rows, plan);
    let selectedIsLocked = false;
    for (const opt of weekSelect.options) {
      const isDone = completed.has(opt.value);
      opt.disabled = isDone;
      opt.textContent = isDone ? `${opt.value} (done)` : opt.value;
      if (isDone && opt.value === weekSelect.value) selectedIsLocked = true;
    }

    if (selectedIsLocked) {
      const nextOpen = Array.from(weekSelect.options).find((o) => !o.disabled);
      if (nextOpen) {
        weekSelect.value = nextOpen.value;
        populatePhases();
        syncPrescribed();
      }
    }
  }

    const day = d.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    const monday = new Date(d);
    monday.setDate(d.getDate() + diff);
    return monday;
  }

        groups.push(current);

    const todayKey = toISO(new Date());
    const buckets = new Map();
    for (const g of groups) {
      const [y, m, d] = g.date.split("-").map(Number);
      const monday = startOfWeekMonday(new Date(y, m - 1, d));
      const key = toISO(monday);
      if (!buckets.has(key)) buckets.set(key, { monday, groups: [] });
      buckets.get(key).groups.push(g);
    }

    const fmt = (d) => d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    const sortedKeys = [...buckets.keys()].sort();

    container.innerHTML = sortedKeys
      .map((key) => {
        const bucket = buckets.get(key);
        const sunday = new Date(bucket.monday);
        sunday.setDate(bucket.monday.getDate() + 6);
        const isCurrentWeek = todayKey >= toISO(bucket.monday) && todayKey <= toISO(sunday);
        const body = bucket.groups.map(buildDateGroupHTML).join("");
        return `<details class="week-card${isCurrentWeek ? " current-week" : ""}"><summary>Week of ${fmt(bucket.monday)} – ${fmt(sunday)}</summary><div class="week-card-body">${body}</div></details>`;
      })
      .join("");

    wireDateGroupButtons(container, groups);
  }

  function computeCalendarDays(monthDate) {
    const first = new Date(monthDate.getFullYear(), monthDate.getMonth(), 1);
    const last = new Date(monthDate.getFullYear(), monthDate.getMonth() + 1, 0);
    const gridStart = startOfWeekMonday(first);
    const gridEnd = startOfWeekMonday(last);
    gridEnd.setDate(gridEnd.getDate() + 6);
    const days = [];
    const cur = new Date(gridStart);
    while (cur <= gridEnd) {
      days.push(new Date(cur));
      cur.setDate(cur.getDate() + 1);
    }
    return days;
  }

  function renderMonthCalendar(container, detailContainer, groups, monthDate) {
    const groupMap = new Map(groups.map((g) => [g.date, g]));
    const days = computeCalendarDays(monthDate);
    const todayKey = toISO(new Date());
    const monthIndex = monthDate.getMonth();

    const weekdayHeaders = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]
      .map((d) => `<div class="cal-weekday">${d}</div>`)
      .join("");

    const cells = days
      .map((d) => {
        const key = toISO(d);
        const inMonth = d.getMonth() === monthIndex;
        const hasData = groupMap.has(key);
        const isToday = key === todayKey;
        const classes = ["cal-day"];
        if (!inMonth) classes.push("other-month");
        if (isToday) classes.push("today");
        return `<button type="button" class="${classes.join(" ")}" data-date="${key}"${inMonth ? "" : " disabled"}><span>${d.getDate()}</span>${hasData ? '<span class="cal-dot"></span>' : ""}</button>`;
      })
      .join("");

    container.innerHTML = `<div class="calendar-grid">${weekdayHeaders}${cells}</div>`;
    detailContainer.innerHTML = '<p class="empty-note">Tap a day to see its workout.</p>';

    container.querySelectorAll(".cal-day:not(.other-month)").forEach((btn) => {
      btn.addEventListener("click", () => {
        container.querySelectorAll(".cal-day.selected").forEach((el) => el.classList.remove("selected"));
        btn.classList.add("selected");
        const g = groupMap.get(btn.dataset.date);
        if (!g) {
          detailContainer.innerHTML = '<p class="empty-note">Nothing logged this day.</p>';
          return;
        }
        detailContainer.innerHTML = buildDateGroupHTML(g);
        wireReportButtons(detailContainer, g.date, g.rows);
      });
    });
  }

  function buildLineChartSVG(points) {
    const width = 300;
    const height = 130;
    const padL = 32;
    const padR = 14;
    const padT = 18;
    const padB = 22;
    const plotW = width - padL - padR;
    const plotH = height - padT - padB;
    const weights = points.map((p) => p.weight);
    const minW = Math.min(...weights);
    const maxW = Math.max(...weights);
    const range = maxW - minW || 10;
    const yFor = (w) => padT + plotH - ((w - minW) / range) * plotH;
    const xFor = (i) => padL + (points.length === 1 ? plotW / 2 : (i / (points.length - 1)) * plotW);

    const gridW = [minW, maxW]
      .filter((w, i, arr) => arr.indexOf(w) === i)
      .map((w) => `<line x1="${padL}" x2="${width - padR}" y1="${yFor(w).toFixed(1)}" y2="${yFor(w).toFixed(1)}" stroke="#3a2f26" stroke-width="1"/><text x="${padL - 6}" y="${(yFor(w) + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="#a99a87">${w}</text>`)
      .join("");

    const linePoints = points.map((p, i) => `${xFor(i).toFixed(1)},${yFor(p.weight).toFixed(1)}`).join(" ");

    const dots = points
      .map(
        (p, i) =>
          `<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(p.weight).toFixed(1)}" r="5" fill="#ffcf7a" stroke="#211b16" stroke-width="2"><title>${p.label}: ${p.weight} lbs</title></circle>`
      )
      .join("");

    const xLabels = points
      .map((p, i) => `<text x="${xFor(i).toFixed(1)}" y="${height - 4}" text-anchor="middle" font-size="8" fill="#a99a87">${p.shortLabel}</text>`)
      .join("");

    const last = points[points.length - 1];
    const endLabel = `<text x="${xFor(points.length - 1).toFixed(1)}" y="${(yFor(last.weight) - 11).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="#ffcf7a">${last.weight} lbs</text>`;

    return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Weight progression, ending at ${last.weight} lbs">${gridW}<polyline points="${linePoints}" fill="none" stroke="#ffcf7a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xLabels}${endLabel}</svg>`;
  }

  function renderProgression(container, groups) {
    const byExercise = {};
    for (const g of groups) {
      for (const r of g.rows) {
        if (!r.phase || !(r.phase.startsWith("Working") || r.phase === "Max Attempt")) continue;
        const ex = r.exercise || "Unknown";
        if (!byExercise[ex]) byExercise[ex] = {};
        const w = r.actualWeight ?? 0;
        byExercise[ex][g.date] = Math.max(byExercise[ex][g.date] ?? 0, w);
      }
    }

    const exercises = Object.keys(byExercise);
    if (!exercises.length) {
      container.innerHTML = '<p class="empty-note">Nothing logged in this range yet.</p>';
      return;
    }

    container.innerHTML = exercises
      .map((ex) => {
        const points = Object.entries(byExercise[ex])
          .sort(([a], [b]) => (a < b ? -1 : 1))
          .map(([date, weight]) => {
            const [y, m, d] = date.split("-").map(Number);
            const parsed = new Date(y, m - 1, d);
            return {
              weight,
              label: parsed.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }),
              shortLabel: parsed.toLocaleDateString("en-US", { month: "numeric", day: "numeric" }),
            };
          });
        return `<div class="progression-card"><h3>${ex} — working weight</h3>${buildLineChartSVG(points)}</div>`;
      })
      .join("");
  }

  async function fetchRangeGroups(start, end) {
    const res = await fetch(`${WORKER_URL}/range?start=${start}&end=${end}`);
    if (!res.ok) throw new Error("bad response");
    const data = await res.json();
    return groupByDate(data.rows || []);
  }

  async function loadRangePanel(container, start, end, renderer) {
    container.innerHTML = '<p class="empty-note">Loading…</p>';
    try {
      const groups = await fetchRangeGroups(start, end);
      (renderer || renderGroupedRows)(container, groups);
    } catch (e) {
      container.innerHTML = '<p class="empty-note">Couldn\'t load — check your connection.</p>';
    }
  }

  async function loadProgressPanel(container, start, end) {
    container.innerHTML = '<p class="empty-note">Loading…</p>';
    try {
      const groups = await fetchRangeGroups(start, end);
      renderProgression(container, groups);
    } catch (e) {
      container.innerHTML = '<p class="empty-note">Couldn\'t load — check your connection.</p>';
    }
  }

  const tabButtons = document.querySelectorAll(".tab-btn");
  const tabPanels = {
    today: document.getElementById("tab-today"),
    week: document.getElementById("tab-week"),
    month: document.getElementById("tab-month"),
    progress: document.getElementById("tab-progress"),
  };

  let weekAnchor = new Date();
  let monthAnchor = new Date();
  const weekLabel = document.getElementById("week-label");
  const monthLabel = document.getElementById("month-label");

  function renderWeek() {
    const [start, end] = monthRange(weekAnchor);
    weekLabel.textContent = weekAnchor.toLocaleDateString("en-US", { month: "long", year: "numeric" });
    loadRangePanel(document.getElementById("week-body"), start, end, (container, groups) =>
      renderWeekList(container, groups, weekAnchor)
    );
  }

  function renderMonth() {
    const [start, end] = monthRange(monthAnchor);
    monthLabel.textContent = monthAnchor.toLocaleDateString("en-US", { month: "long", year: "numeric" });
    document.getElementById("month-day-detail").innerHTML = "";
    loadRangePanel(document.getElementById("month-calendar"), start, end, (container, groups) =>
      renderMonthCalendar(container, document.getElementById("month-day-detail"), groups, monthAnchor)
    );
  }

  document.getElementById("week-prev").addEventListener("click", () => {
    weekAnchor = new Date(weekAnchor.getFullYear(), weekAnchor.getMonth() - 1, 1);
    renderWeek();
  });
  document.getElementById("week-next").addEventListener("click", () => {
    weekAnchor = new Date(weekAnchor.getFullYear(), weekAnchor.getMonth() + 1, 1);
    renderWeek();
  });
  document.getElementById("month-prev").addEventListener("click", () => {
    monthAnchor = new Date(monthAnchor.getFullYear(), monthAnchor.getMonth() - 1, 1);
    renderMonth();
  });
  document.getElementById("month-next").addEventListener("click", () => {
    monthAnchor = new Date(monthAnchor.getFullYear(), monthAnchor.getMonth() + 1, 1);
    renderMonth();
  });

  let progressAnchor = new Date();
  const progressLabel = document.getElementById("progress-label");

  function renderProgress() {
    const [start, end] = monthRange(progressAnchor);
    progressLabel.textContent = progressAnchor.toLocaleDateString("en-US", { month: "long", year: "numeric" });
    loadProgressPanel(document.getElementById("progress-body"), start, end);
  }

  document.getElementById("progress-prev").addEventListener("click", () => {
    progressAnchor = new Date(progressAnchor.getFullYear(), progressAnchor.getMonth() - 1, 1);
    renderProgress();
  });
  document.getElementById("progress-next").addEventListener("click", () => {
    progressAnchor = new Date(progressAnchor.getFullYear(), progressAnchor.getMonth() + 1, 1);
    renderProgress();
  });

  function switchTab(name) {
    for (const btn of tabButtons) btn.classList.toggle("active", btn.dataset.tab === name);
    for (const key in tabPanels) tabPanels[key].hidden = key !== name;

    if (name === "today") {
      dateInput.value = todayISO();
      syncWeekday();
      loadToday();
    } else if (name === "week") {
      weekAnchor = new Date();
      renderWeek();
    } else if (name === "month") {
      monthAnchor = new Date();
      renderMonth();
    } else if (name === "progress") {
      progressAnchor = new Date();
      renderProgress();
    }
  }

  tabButtons.forEach((btn) => btn.addEventListener("click", () => switchTab(btn.dataset.tab)));

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    statusEl.className = "";
    statusEl.textContent = "Saving...";

    const custom = isFreeEntryMode();
    let payload;
    let restString;

    if (custom) {
      payload = {
        date: dateInput.value,
        exercise: isTypedCustomMode() ? customExercise.value.trim() : exerciseSelect.value,
        week: customWeek.value.trim() || "Custom",
        phase: customPhase.value.trim(),
        setNumber: customSetNumber.value,
        targetWeight: customTargetWeight.value || null,
        targetReps: customTargetReps.value.trim() || null,
        actualWeight: actualWeightInput.value,
        reps: document.getElementById("reps").value,
        notes: document.getElementById("notes").value,
      };
      restString = customRest.value.trim();
    } else {
      const plan = currentPlan()[weekSelect.value];
      const idx = plan.findIndex((s) => s.phase === phaseSelect.value);
      const step = plan[idx];
      payload = {
        date: dateInput.value,
        exercise: document.getElementById("exercise").value,
        week: weekSelect.value,
        phase: step.phase,
        setNumber: idx + 1,
        targetWeight: step.weight,
        targetReps: step.reps,
        actualWeight: actualWeightInput.value,
        reps: document.getElementById("reps").value,
        notes: document.getElementById("notes").value,
      };
      restString = step.rest;
    }

    try {
      const res = await fetch(`${WORKER_URL}/log`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed to save");

      statusEl.className = "ok";
      statusEl.textContent = "Saved.";
      document.getElementById("reps").value = "";
      document.getElementById("notes").value = "";

      const restSeconds = parseRestSeconds(restString);
      if (restSeconds) {
        startRestTimer(restSeconds);
      } else {
        stopRestTimer();
      }

      if (custom) {
        customSetNumber.value = Number(customSetNumber.value || 1) + 1;
      } else {
        advancePhase();
        refreshWeekLocks();
      }
      loadToday();
    } catch (err) {
      statusEl.className = "err";
      statusEl.textContent = err.message || "Something went wrong.";
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
