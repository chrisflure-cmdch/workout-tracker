<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout Log</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --ground: #171310;
    --panel: #211b16;
    --line: #3a2f26;
    --text: #f2e9db;
    --text-dim: #a99a87;
    --glow: #e8a33d;
    --glow-bright: #ffcf7a;
    --ok: #6fcf7c;
    --err: #e0665a;
    --accent-blue: #3a6ea5;
    --accent-green: #4caf50;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ground); color: var(--text); }
  body {
    min-height: 100dvh;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    padding: 20px 16px 0;
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin: 6px 0 20px;
  }
  .header svg { flex-shrink: 0; }
  .header svg.blue { color: var(--accent-blue); }
  .header svg.orange { color: var(--glow-bright); }
  h1 {
    font-size: 24px;
    letter-spacing: 0.03em;
    margin: 0;
    color: var(--glow-bright);
    text-transform: uppercase;
    white-space: nowrap;
  }
  .banner {
    margin: 32px -16px 0;
    padding: 16px 16px 28px;
    background: linear-gradient(90deg, var(--accent-blue), var(--glow));
    color: #fff;
    text-align: center;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 480px;
    margin: 0 auto;
  }
  label {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13px;
    color: var(--text-dim);
  }
  input, select, textarea {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--text);
    padding: 14px;
    font-size: 17px;
    font-family: inherit;
  }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--glow);
    border-color: var(--glow);
  }
  .row { display: flex; gap: 10px; }
  .row > label, .row > div { flex: 1; }
  .prescribed {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 13px;
  }
  .prescribed .item { display: flex; flex-direction: column; gap: 4px; }
  .prescribed .label { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
  .prescribed .value { font-size: 16px; color: var(--glow-bright); font-weight: 600; }
  .plates-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 4px 14px 14px;
  }
  .plate {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-weight: 700;
    font-family: ui-sans-serif, system-ui, sans-serif;
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.25);
    flex-shrink: 0;
  }
  .plate-45   { width: 46px; height: 46px; background: #3a6ea5; color: #fff; font-size: 13px; }
  .plate-35   { width: 42px; height: 42px; background: #4caf50; color: #fff; font-size: 12px; }
  .plate-25   { width: 38px; height: 38px; background: #d4b83a; color: #211b16; font-size: 12px; }
  .plate-10   { width: 32px; height: 32px; background: #f2e9db; color: #211b16; font-size: 11px; }
  .plate-5    { width: 24px; height: 24px; background: #e0665a; color: #fff; font-size: 10px; }
  .plate-2-5  { width: 18px; height: 18px; background: #e88ac6; color: #211b16; font-size: 8px; }
  .bar-only {
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
    padding: 12px 0;
  }
  button {
    margin-top: 6px;
    padding: 16px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--glow-bright), var(--glow));
    color: #241705;
    font-weight: 700;
    font-size: 17px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; }
  #status {
    max-width: 480px;
    margin: 12px auto 0;
    font-size: 14px;
    min-height: 20px;
  }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
  .rest-timer {
    max-width: 480px;
    margin: 16px auto 0;
    background: var(--panel);
    border: 1px solid var(--accent-blue);
    border-radius: 14px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .rest-timer .rest-label {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .rest-timer .rest-clock {
    font-size: 40px;
    font-weight: 800;
    color: var(--glow-bright);
    font-variant-numeric: tabular-nums;
  }
  .rest-timer.done .rest-clock { color: var(--ok); }
  .rest-timer button {
    margin: 0;
    padding: 10px 22px;
    font-size: 14px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text-dim);
    border-radius: 999px;
  }
  .today {
    max-width: 480px;
    margin: 28px auto 0;
  }
  .today h2 {
    font-size: 15px;
    color: var(--text-dim);
    margin: 0 0 10px;
  }
  .today table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .today th, .today td {
    text-align: left;
    padding: 8px 6px;
    border-bottom: 1px solid var(--line);
  }
  .today th { color: var(--text-dim); font-weight: 500; }
  .tabs {
    display: flex;
    gap: 8px;
    max-width: 480px;
    margin: 0 auto 22px;
  }
  .tab-btn {
    flex: 1;
    margin: 0;
    padding: 10px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.03em;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--text-dim);
    cursor: pointer;
  }
  .tab-btn.today.active { border-color: var(--glow); color: var(--glow-bright); background: rgba(232, 163, 61, 0.14); }
  .tab-btn.week.active { border-color: var(--accent-blue); color: #9dc3e8; background: rgba(58, 110, 165, 0.18); }
  .tab-btn.month.active { border-color: var(--accent-green); color: #9adf9e; background: rgba(76, 175, 80, 0.14); }
  .range-view { max-width: 480px; margin: 0 auto; }
  .date-group { margin-bottom: 22px; }
  .date-group h3 { font-size: 14px; color: var(--glow-bright); margin: 0 0 8px; }
  .date-group table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .date-group th, .date-group td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  .date-group th { color: var(--text-dim); font-weight: 500; }
  .empty-note { color: var(--text-dim); font-size: 14px; text-align: center; padding: 30px 0; }
  .progression-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 14px 8px;
    margin-bottom: 22px;
  }
  .progression-card h3 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin: 0 0 6px;
  }
  .progression-card svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<div class="header">
  <svg class="orange" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <path d="M2 12h2M6 8v8M6 8a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1zM9 12h6"/>
  </svg>
  <h1>Workout Log</h1>
  <svg class="blue" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <path d="M22 12h-2M18 8v8M18 8a1 1 0 0 0-1-1h-1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h1a1 1 0 0 0 1-1zM15 12H9"/>
  </svg>
</div>

<div class="tabs">
  <button type="button" class="tab-btn today active" data-tab="today">Today</button>
  <button type="button" class="tab-btn week" data-tab="week">Week</button>
  <button type="button" class="tab-btn month" data-tab="month">Month</button>
</div>

<div id="tab-today" class="tab-panel">
<form id="log-form">
  <label><span>Date <span id="date-weekday" style="color: var(--glow-bright); font-weight: 600;"></span></span>
    <input type="date" id="date" required>
  </label>

  <label>Exercise
    <select id="exercise" required>
      <option value="Incline Bench Press">Incline Bench Press</option>
      <option value="__custom__">+ Custom (build as you go)</option>
    </select>
  </label>

  <div id="standard-fields">
    <label>Week
      <select id="week" required></select>
    </label>

    <label>Phase
      <select id="phase" required></select>
    </label>

    <div class="prescribed">
      <div class="item"><span class="label">Target Weight</span><span class="value" id="p-weight">—</span></div>
      <div class="item"><span class="label">Target Reps</span><span class="value" id="p-reps">—</span></div>
      <div class="item"><span class="label">Rest</span><span class="value" id="p-rest">—</span></div>
    </div>
    <div class="plates-row" id="p-plates"></div>
  </div>

  <div id="custom-fields" hidden style="display: flex; flex-direction: column; gap: 14px;">
    <label>Exercise Name
      <input type="text" id="custom-exercise" placeholder="e.g. Flat Bench Press">
    </label>
    <label>Week / Block <span style="color: var(--text-dim); font-weight: 400;">(optional)</span>
      <input type="text" id="custom-week" placeholder="e.g. Week 1 - Foundation">
    </label>
    <div class="row">
      <label>Phase / Set Label
        <input type="text" id="custom-phase" placeholder="e.g. Working Set 1">
      </label>
      <label>Set #
        <input type="number" id="custom-set-number" inputmode="numeric" min="1" step="1" value="1">
      </label>
    </div>
    <div class="row">
      <label>Target Weight <span style="color: var(--text-dim); font-weight: 400;">(optional)</span>
        <input type="number" id="custom-target-weight" inputmode="decimal" step="0.5">
      </label>
      <label>Target Reps <span style="color: var(--text-dim); font-weight: 400;">(optional)</span>
        <input type="text" id="custom-target-reps" placeholder="e.g. 2 reps">
      </label>
    </div>
    <label>Rest <span style="color: var(--text-dim); font-weight: 400;">(optional, e.g. "90 sec" or "3 min")</span>
      <input type="text" id="custom-rest" placeholder="e.g. 2 min">
    </label>
  </div>

  <div class="row">
    <label>Actual Weight (lbs)
      <input type="number" id="actualWeight" inputmode="decimal" step="0.5" required>
    </label>
    <label>Actual Reps
      <input type="number" id="reps" inputmode="numeric" min="0" step="1" required>
    </label>
  </div>

  <label>Notes
    <textarea id="notes" rows="2" placeholder="optional"></textarea>
  </label>

  <button type="submit" id="submit-btn">Log set</button>
  <div id="status"></div>
</form>

<div class="rest-timer" id="rest-timer" hidden>
  <span class="rest-label">Rest</span>
  <span class="rest-clock" id="rest-clock">0:00</span>
  <button type="button" id="skip-rest">Skip rest</button>
</div>

<div class="today">
  <h2 id="today-heading">Logged</h2>
  <table>
    <thead>
      <tr><th>Exercise</th><th>Phase</th><th>Weight</th><th>Reps</th></tr>
    </thead>
    <tbody id="today-body"></tbody>
  </table>
</div>
</div>

<div id="tab-week" class="tab-panel" hidden>
  <div class="range-view" id="week-progression"></div>
  <div class="range-view" id="week-body"></div>
</div>

<div id="tab-month" class="tab-panel" hidden>
  <div class="range-view" id="month-progression"></div>
  <div class="range-view" id="month-body"></div>
</div>

<div class="banner">⚡ Track today. Stronger tomorrow. ⚡</div>

<script>
  const WORKER_URL = "https://workout-log-api.chrisflure.workers.dev";

  // Source of truth: 4-Week Smith Machine Strength Progression Tracker (Incline Bench Press),
  // corrected 2026-09-06 for the 23 lb Body Masters counterbalanced bar.
  const WEEK_PLANS = {
    "Week 1 - Foundation": [
      { phase: "Warm-Up Set 1", weight: 23, reps: "10 reps", rest: "60 sec", plates: [] },
      { phase: "Warm-Up Set 2", weight: 73, reps: "5 reps", rest: "60 sec", plates: [25] },
      { phase: "Warm-Up Set 3", weight: 113, reps: "3 reps", rest: "90 sec", plates: [45] },
      { phase: "Warm-Up Set 4", weight: 133, reps: "1 rep", rest: "2 min", plates: [45, 10] },
      { phase: "Working Set 1", weight: 143, reps: "2 reps", rest: "3-5 min", plates: [45, 10, 5] },
      { phase: "Working Set 2", weight: 143, reps: "2 reps", rest: "3-5 min", plates: [45, 10, 5] },
      { phase: "Working Set 3", weight: 143, reps: "2 reps", rest: "3-5 min", plates: [45, 10, 5] },
      { phase: "Working Set 4", weight: 143, reps: "2 reps", rest: "—", plates: [45, 10, 5] },
    ],
    "Week 2 - Neurological Peak": [
      { phase: "Warm-Up Set 1", weight: 23, reps: "10 reps", rest: "60 sec", plates: [] },
      { phase: "Warm-Up Set 2", weight: 73, reps: "5 reps", rest: "60 sec", plates: [25] },
      { phase: "Warm-Up Set 3", weight: 113, reps: "3 reps", rest: "90 sec", plates: [45] },
      { phase: "Warm-Up Set 4", weight: 133, reps: "1 rep", rest: "2 min", plates: [45, 10] },
      { phase: "Working Set 1", weight: 153, reps: "2 reps", rest: "4-5 min", plates: [45, 10, 10] },
      { phase: "Working Set 2", weight: 153, reps: "2 reps", rest: "4-5 min", plates: [45, 10, 10] },
      { phase: "Working Set 3", weight: 153, reps: "2 reps", rest: "—", plates: [45, 10, 10] },
    ],
    "Week 3 - De-load": [
      { phase: "Warm-Up Set 1", weight: 23, reps: "10 reps", rest: "60 sec", plates: [] },
      { phase: "Warm-Up Set 2", weight: 73, reps: "5 reps", rest: "60 sec", plates: [25] },
      { phase: "Working Set 1", weight: 113, reps: "3 reps (Slow)", rest: "2 min", plates: [45] },
      { phase: "Working Set 2", weight: 113, reps: "3 reps (Slow)", rest: "2 min", plates: [45] },
      { phase: "Working Set 3", weight: 113, reps: "3 reps (Slow)", rest: "—", plates: [45] },
    ],
    "Week 4 - Max Effort Test": [
      { phase: "Warm-Up Set 1", weight: 23, reps: "10 reps", rest: "60 sec", plates: [] },
      { phase: "Warm-Up Set 2", weight: 73, reps: "5 reps", rest: "60 sec", plates: [25] },
      { phase: "Warm-Up Set 3", weight: 113, reps: "3 reps", rest: "90 sec", plates: [45] },
      { phase: "Warm-Up Set 4", weight: 133, reps: "1 rep", rest: "2 min", plates: [45, 10] },
      { phase: "Warm-Up Set 5", weight: 153, reps: "1 rep", rest: "3 min", plates: [45, 10, 10] },
      { phase: "Max Attempt", weight: 163, reps: "1 rep (Max Effort)", rest: "5 min before retry", plates: [45, 25] },
    ],
  };

  const dateInput = document.getElementById("date");
  const exerciseSelect = document.getElementById("exercise");
  const standardFields = document.getElementById("standard-fields");
  const customFields = document.getElementById("custom-fields");
  const customExercise = document.getElementById("custom-exercise");
  const customWeek = document.getElementById("custom-week");
  const customPhase = document.getElementById("custom-phase");
  const customSetNumber = document.getElementById("custom-set-number");
  const customTargetWeight = document.getElementById("custom-target-weight");
  const customTargetReps = document.getElementById("custom-target-reps");
  const customRest = document.getElementById("custom-rest");
  const weekSelect = document.getElementById("week");
  const phaseSelect = document.getElementById("phase");
  const pWeight = document.getElementById("p-weight");
  const pReps = document.getElementById("p-reps");
  const pRest = document.getElementById("p-rest");
  const pPlates = document.getElementById("p-plates");
  const actualWeightInput = document.getElementById("actualWeight");
  const form = document.getElementById("log-form");
  const statusEl = document.getElementById("status");
  const submitBtn = document.getElementById("submit-btn");
  const todayBody = document.getElementById("today-body");
  const dateWeekday = document.getElementById("date-weekday");
  const todayHeading = document.getElementById("today-heading");
  const restTimerEl = document.getElementById("rest-timer");
  const restClockEl = document.getElementById("rest-clock");
  const skipRestBtn = document.getElementById("skip-rest");

  function parseRestSeconds(rest) {
    if (!rest) return null;
    const range = rest.match(/(\d+)\s*-\s*(\d+)\s*min/);
    if (range) return parseInt(range[2], 10) * 60;
    const min = rest.match(/(\d+)\s*min/);
    if (min) return parseInt(min[1], 10) * 60;
    const sec = rest.match(/(\d+)\s*sec/);
    if (sec) return parseInt(sec[1], 10);
    return null;
  }

  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      osc.start();
      osc.stop(ctx.currentTime + 0.5);
    } catch (e) {
      // audio not available — silent no-op
    }
  }

  let restInterval = null;

  function formatClock(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${m}:${String(sec).padStart(2, "0")}`;
  }

  function stopRestTimer() {
    if (restInterval) {
      clearInterval(restInterval);
      restInterval = null;
    }
    restTimerEl.hidden = true;
    restTimerEl.classList.remove("done");
  }

  function startRestTimer(seconds) {
    stopRestTimer();
    let remaining = seconds;
    restTimerEl.hidden = false;
    restClockEl.textContent = formatClock(remaining);
    restInterval = setInterval(() => {
      remaining -= 1;
      if (remaining <= 0) {
        clearInterval(restInterval);
        restInterval = null;
        restClockEl.textContent = "Go!";
        restTimerEl.classList.add("done");
        beep();
        return;
      }
      restClockEl.textContent = formatClock(remaining);
    }, 1000);
  }

  skipRestBtn.addEventListener("click", stopRestTimer);

  function todayISO() {
    const d = new Date();
    const off = d.getTimezoneOffset();
    return new Date(d.getTime() - off * 60000).toISOString().slice(0, 10);
  }
  dateInput.value = todayISO();

  function syncWeekday() {
    if (!dateInput.value) { dateWeekday.textContent = ""; todayHeading.textContent = "Logged"; return; }
    const [y, m, d] = dateInput.value.split("-").map(Number);
    const parsed = new Date(y, m - 1, d);
    const weekday = parsed.toLocaleDateString("en-US", { weekday: "long" });
    const shortDate = parsed.toLocaleDateString("en-US", { month: "short", day: "numeric" });
    dateWeekday.textContent = `— ${weekday}`;
    todayHeading.textContent = `Logged — ${weekday}, ${shortDate}`;
  }
  dateInput.addEventListener("change", syncWeekday);
  syncWeekday();

  for (const week of Object.keys(WEEK_PLANS)) {
    const opt = document.createElement("option");
    opt.value = week;
    opt.textContent = week;
    weekSelect.appendChild(opt);
  }

  function populatePhases() {
    phaseSelect.innerHTML = "";
    for (const step of WEEK_PLANS[weekSelect.value]) {
      const opt = document.createElement("option");
      opt.value = step.phase;
      opt.textContent = `${step.phase} — ${step.weight} lbs`;
      phaseSelect.appendChild(opt);
    }
  }

  function renderPlates(plates) {
    if (!plates.length) {
      pPlates.innerHTML = '<span class="bar-only">Bar only — no plates</span>';
      return;
    }
    pPlates.innerHTML = plates
      .map((w) => `<span class="plate plate-${String(w).replace(".", "-")}">${w}</span>`)
      .join("");
  }

  function syncPrescribed() {
    const plan = WEEK_PLANS[weekSelect.value];
    const step = plan.find((s) => s.phase === phaseSelect.value) || plan[0];
    pWeight.textContent = `${step.weight} lbs`;
    pReps.textContent = step.reps;
    pRest.textContent = step.rest;
    actualWeightInput.value = step.weight;
    renderPlates(step.plates);
  }

  weekSelect.addEventListener("change", () => {
    populatePhases();
    syncPrescribed();
    stopRestTimer();
  });
  phaseSelect.addEventListener("change", () => {
    syncPrescribed();
    stopRestTimer();
  });

  populatePhases();
  syncPrescribed();

  function isCustomMode() {
    return exerciseSelect.value === "__custom__";
  }

  function toggleExerciseMode() {
    const custom = isCustomMode();
    standardFields.hidden = custom;
    customFields.hidden = !custom;

    weekSelect.required = !custom;
    phaseSelect.required = !custom;
    customExercise.required = custom;
    customPhase.required = custom;

    stopRestTimer();
    if (custom) {
      actualWeightInput.value = "";
    } else {
      syncPrescribed();
    }
  }
  exerciseSelect.addEventListener("change", toggleExerciseMode);
  toggleExerciseMode();

  async function loadToday() {
    try {
      const res = await fetch(`${WORKER_URL}/today?date=${encodeURIComponent(dateInput.value)}`);
      if (!res.ok) return;
      const data = await res.json();
      todayBody.innerHTML = "";
      for (const row of data.rows || []) {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${row.exercise ?? ""}</td><td>${row.phase ?? ""}</td><td>${row.actualWeight ?? ""} lbs</td><td>${row.reps ?? ""}</td>`;
        todayBody.appendChild(tr);
      }
    } catch (e) {
      // silent — today list is a convenience, not critical path
    }
  }

  dateInput.addEventListener("change", loadToday);
  loadToday();

  function advancePhase() {
    const plan = WEEK_PLANS[weekSelect.value];
    const idx = plan.findIndex((s) => s.phase === phaseSelect.value);
    if (idx >= 0 && idx < plan.length - 1) {
      phaseSelect.selectedIndex = idx + 1;
      syncPrescribed();
    }
  }

  function toISO(d) {
    const off = d.getTimezoneOffset();
    return new Date(d.getTime() - off * 60000).toISOString().slice(0, 10);
  }

  function startOfWeekMonday(d) {
    const day = d.getDay();
    const diff = day === 0 ? -6 : 1 - day;
    const monday = new Date(d);
    monday.setDate(d.getDate() + diff);
    return monday;
  }

  function monthRange(d) {
    const first = new Date(d.getFullYear(), d.getMonth(), 1);
    const last = new Date(d.getFullYear(), d.getMonth() + 1, 0);
    return [toISO(first), toISO(last)];
  }

  function groupByDate(rows) {
    const groups = [];
    let current = null;
    for (const row of rows) {
      if (!current || current.date !== row.date) {
        current = { date: row.date, rows: [] };
        groups.push(current);
      }
      current.rows.push(row);
    }
    return groups;
  }

  function renderGroupedRows(container, groups) {
    if (!groups.length) {
      container.innerHTML = '<p class="empty-note">Nothing logged in this range yet.</p>';
      return;
    }
    container.innerHTML = groups
      .map((g) => {
        const [y, m, d] = g.date.split("-").map(Number);
        const label = new Date(y, m - 1, d).toLocaleDateString("en-US", {
          weekday: "long",
          month: "short",
          day: "numeric",
        });
        const rows = g.rows
          .map((r) => `<tr><td>${r.exercise ?? ""}</td><td>${r.phase ?? ""}</td><td>${r.actualWeight ?? ""} lbs</td><td>${r.reps ?? ""}</td></tr>`)
          .join("");
        return `<div class="date-group"><h3>${label}</h3><table><thead><tr><th>Exercise</th><th>Phase</th><th>Weight</th><th>Reps</th></tr></thead><tbody>${rows}</tbody></table></div>`;
      })
      .join("");
  }

  function buildLineChartSVG(points) {
    const width = 300;
    const height = 130;
    const padL = 32;
    const padR = 14;
    const padT = 18;
    const padB = 22;
    const plotW = width - padL - padR;
    const plotH = height - padT - padB;
    const weights = points.map((p) => p.weight);
    const minW = Math.min(...weights);
    const maxW = Math.max(...weights);
    const range = maxW - minW || 10;
    const yFor = (w) => padT + plotH - ((w - minW) / range) * plotH;
    const xFor = (i) => padL + (points.length === 1 ? plotW / 2 : (i / (points.length - 1)) * plotW);

    const gridW = [minW, maxW]
      .filter((w, i, arr) => arr.indexOf(w) === i)
      .map((w) => `<line x1="${padL}" x2="${width - padR}" y1="${yFor(w).toFixed(1)}" y2="${yFor(w).toFixed(1)}" stroke="#3a2f26" stroke-width="1"/><text x="${padL - 6}" y="${(yFor(w) + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="#a99a87">${w}</text>`)
      .join("");

    const linePoints = points.map((p, i) => `${xFor(i).toFixed(1)},${yFor(p.weight).toFixed(1)}`).join(" ");

    const dots = points
      .map(
        (p, i) =>
          `<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(p.weight).toFixed(1)}" r="5" fill="#ffcf7a" stroke="#211b16" stroke-width="2"><title>${p.label}: ${p.weight} lbs</title></circle>`
      )
      .join("");

    const xLabels = points
      .map((p, i) => `<text x="${xFor(i).toFixed(1)}" y="${height - 4}" text-anchor="middle" font-size="8" fill="#a99a87">${p.shortLabel}</text>`)
      .join("");

    const last = points[points.length - 1];
    const endLabel = `<text x="${xFor(points.length - 1).toFixed(1)}" y="${(yFor(last.weight) - 11).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="700" fill="#ffcf7a">${last.weight} lbs</text>`;

    return `<svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Weight progression, ending at ${last.weight} lbs">${gridW}<polyline points="${linePoints}" fill="none" stroke="#ffcf7a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xLabels}${endLabel}</svg>`;
  }

  function renderProgression(container, groups) {
    const byExercise = {};
    for (const g of groups) {
      for (const r of g.rows) {
        if (!r.phase || !(r.phase.startsWith("Working") || r.phase === "Max Attempt")) continue;
        const ex = r.exercise || "Unknown";
        if (!byExercise[ex]) byExercise[ex] = {};
        const w = r.actualWeight ?? 0;
        byExercise[ex][g.date] = Math.max(byExercise[ex][g.date] ?? 0, w);
      }
    }

    const exercises = Object.keys(byExercise);
    if (!exercises.length) {
      container.innerHTML = "";
      return;
    }

    container.innerHTML = exercises
      .map((ex) => {
        const points = Object.entries(byExercise[ex])
          .sort(([a], [b]) => (a < b ? -1 : 1))
          .map(([date, weight]) => {
            const [y, m, d] = date.split("-").map(Number);
            const parsed = new Date(y, m - 1, d);
            return {
              weight,
              label: parsed.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }),
              shortLabel: parsed.toLocaleDateString("en-US", { month: "numeric", day: "numeric" }),
            };
          });
        return `<div class="progression-card"><h3>${ex} — working weight</h3>${buildLineChartSVG(points)}</div>`;
      })
      .join("");
  }

  async function loadRangePanel(container, progressionContainer, start, end) {
    container.innerHTML = '<p class="empty-note">Loading…</p>';
    progressionContainer.innerHTML = "";
    try {
      const res = await fetch(`${WORKER_URL}/range?start=${start}&end=${end}`);
      if (!res.ok) throw new Error("bad response");
      const data = await res.json();
      const groups = groupByDate(data.rows || []);
      renderProgression(progressionContainer, groups);
      renderGroupedRows(container, groups);
    } catch (e) {
      container.innerHTML = '<p class="empty-note">Couldn\'t load — check your connection.</p>';
    }
  }

  const tabButtons = document.querySelectorAll(".tab-btn");
  const tabPanels = {
    today: document.getElementById("tab-today"),
    week: document.getElementById("tab-week"),
    month: document.getElementById("tab-month"),
  };

  function switchTab(name) {
    for (const btn of tabButtons) btn.classList.toggle("active", btn.dataset.tab === name);
    for (const key in tabPanels) tabPanels[key].hidden = key !== name;

    if (name === "week") {
      const monday = startOfWeekMonday(new Date());
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      loadRangePanel(document.getElementById("week-body"), document.getElementById("week-progression"), toISO(monday), toISO(sunday));
    } else if (name === "month") {
      const [start, end] = monthRange(new Date());
      loadRangePanel(document.getElementById("month-body"), document.getElementById("month-progression"), start, end);
    }
  }

  tabButtons.forEach((btn) => btn.addEventListener("click", () => switchTab(btn.dataset.tab)));

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    statusEl.className = "";
    statusEl.textContent = "Saving...";

    const custom = isCustomMode();
    let payload;
    let restString;

    if (custom) {
      payload = {
        date: dateInput.value,
        exercise: customExercise.value.trim(),
        week: customWeek.value.trim() || "Custom",
        phase: customPhase.value.trim(),
        setNumber: customSetNumber.value,
        targetWeight: customTargetWeight.value || null,
        targetReps: customTargetReps.value.trim() || null,
        actualWeight: actualWeightInput.value,
        reps: document.getElementById("reps").value,
        notes: document.getElementById("notes").value,
      };
      restString = customRest.value.trim();
    } else {
      const plan = WEEK_PLANS[weekSelect.value];
      const idx = plan.findIndex((s) => s.phase === phaseSelect.value);
      const step = plan[idx];
      payload = {
        date: dateInput.value,
        exercise: document.getElementById("exercise").value,
        week: weekSelect.value,
        phase: step.phase,
        setNumber: idx + 1,
        targetWeight: step.weight,
        targetReps: step.reps,
        actualWeight: actualWeightInput.value,
        reps: document.getElementById("reps").value,
        notes: document.getElementById("notes").value,
      };
      restString = step.rest;
    }

    try {
      const res = await fetch(`${WORKER_URL}/log`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Failed to save");

      statusEl.className = "ok";
      statusEl.textContent = "Saved.";
      document.getElementById("reps").value = "";
      document.getElementById("notes").value = "";

      const restSeconds = parseRestSeconds(restString);
      if (restSeconds) {
        startRestTimer(restSeconds);
      } else {
        stopRestTimer();
      }

      if (custom) {
        customSetNumber.value = Number(customSetNumber.value || 1) + 1;
      } else {
        advancePhase();
      }
      loadToday();
    } catch (err) {
      statusEl.className = "err";
      statusEl.textContent = err.message || "Something went wrong.";
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>
</body>
